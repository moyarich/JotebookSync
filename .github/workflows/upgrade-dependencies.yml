name: Upgrade dependencies
on:
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
      reject:
        description: Comma-separated package names to exclude from upgrades (optional)
        type: string
        default: ""
permissions:
  contents: write
  packages: read
jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  upgrade:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_upgrade-dependencies.yml@main
    with:
      reject: ${{ inputs.reject }}
