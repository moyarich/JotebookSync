name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
      package:
        description: Publishable workspace package or all
        type: string
        required: true
        default: all
      version-mode:
        description: Version calculation mode
        type: choice
        options: [auto, bump, package-json, exact]
        required: true
        default: auto
      initial-version:
        description: First release version in auto mode
        type: string
        default: "0.1.0"
      version-bump:
        description: SemVer increment for bump mode
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        required: true
        default: patch
      exact-version:
        description: Exact version for exact mode
        type: string
        default: ""
      target-branch:
        description: Branch to receive the release preparation PR
        type: string
        required: true
        default: main
      dry-run:
        description: Preview without opening a PR
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  prepare:
    permissions:
      contents: write
      pull-requests: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-prepare-pr.yml@main
    with:
      package: ${{ inputs.package }}
      version-mode: ${{ inputs.version-mode }}
      initial-version: ${{ inputs.initial-version }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}
      target-branch: ${{ inputs.target-branch }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      workflow-token: ${{ secrets._WORKFLOW_TOKEN }}
