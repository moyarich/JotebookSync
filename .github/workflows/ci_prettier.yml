name: CI / Prettier

on:
  push:
    branches: [main]
    paths: &prettier_paths
      - "**/*.{js,jsx,ts,tsx,mjs,json,yml,yaml,md,mdx}"
      - ".prettier*"
      - ".github/workflows/ci_prettier.yml"
  pull_request:
    paths: *prettier_paths
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
      repair:
        description: Repair and commit formatting or lockfile drift
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  prettier:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_self-heal-prettier.yml@main
    with:
      mode: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_dispatch' && !inputs.repair)) && 'check' || 'fix' }}
      commit: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.repair) }}
      prettier-config: this-repository

