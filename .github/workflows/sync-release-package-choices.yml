name: Sync release package choices

on:
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
      workspace-tools-source:
        description: Workspace Tools CLI source for package discovery
        type: choice
        required: true
        default: auto
        options:
          - auto
          - checkout:current
          - checkout:upstream;branch:main
          - registry:npm:latest
  push:
    branches: [main]
    paths:
      - package.json
      - packages/**/package.json
      - .github/workflows/release.yml
      - .github/workflows/release-draft.yml
      - .github/workflows/publish.yml
      - .github/workflows/restore-release.yml
      - .github/workflows/reset-release.yml
      - .github/workflows/sync-release-package-choices.yml

permissions: {}

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  sync:
    permissions:
      contents: write
      packages: read

    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-sync-package-choices.yml@main

    with:
      workspace-tools-source: ${{ inputs.workspace-tools-source || 'auto' }}
      workflow-files: '[".github/workflows/check-dist.yml",".github/workflows/release-draft.yml",".github/workflows/release.yml",".github/workflows/restore-release.yml",".github/workflows/reset-release.yml",".github/workflows/publish.yml"]'
      packages-directory: packages
      use-workspaces: true
      require-publish-config: false

    secrets:
      workflow-token: ${{ secrets._WORKFLOW_TOKEN }}
