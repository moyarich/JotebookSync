name: Deploy playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/playground/**"
      - "packages/**"
      - "docs/**"
      - "examples/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  pages:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_github-pages.yml@main
    with:
      node-version: "24"
      build-command: npm run build:playground
      output-directory: apps/playground/dist
    secrets: inherit
